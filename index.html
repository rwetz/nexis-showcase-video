<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
        background: #0c1118;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c1118;
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
      }
      /* Untimed wrappers carry the crossfade; the <video> inside carries the timing. */
      .layer {
        position: absolute;
        inset: 0;
      }
      .layer video,
      .layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 0% 100%, rgba(8, 11, 16, 0.55) 0%, rgba(8, 11, 16, 0) 45%);
      }
      .slot {
        position: absolute;
        inset: 0;
      }
      .chip {
        position: absolute;
        left: 56px;
        bottom: 56px;
        display: flex;
        align-items: center;
        gap: 20px;
        max-width: 760px;
        padding: 22px 30px 22px 26px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        background: rgba(12, 17, 24, 0.88);
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
      }
      .dot {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff853d;
        box-shadow: 0 0 18px rgba(255, 133, 61, 0.65);
      }
      .chip-text {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .chip-title {
        color: #f3f5f8;
        font-size: 34px;
        font-weight: 640;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      .chip-sub {
        color: #b9c2cf;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 22px;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <!--
      Real app motion, screencast from the Nexis webview by e2e/specs/clips.test.ts.
      Each layer overlaps the next by 0.6 s; the closing still is the welcome clip's
      first frame, so the last frame equals frame 0 and the loop has no seam.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="26.3" data-fps="30" data-width="1600" data-height="1000">
      <div id="l1" class="layer">
        <video id="v1" src="assets/clips/welcome.mp4" muted playsinline data-start="0" data-duration="4" data-media-start="0.25" data-track-index="0"></video>
      </div>
      <div id="l2" class="layer">
        <video id="v2" src="assets/clips/spotlight.mp4" muted playsinline data-start="3.4" data-duration="6" data-media-start="1.4" data-playback-rate="1.25" data-track-index="1"></video>
        <div class="shade"></div>
      </div>
      <div id="l3" class="layer">
        <video id="v3" src="assets/clips/terminal.mp4" muted playsinline data-start="8.8" data-duration="3.8" data-media-start="0.2" data-track-index="2"></video>
        <div class="shade"></div>
      </div>
      <div id="l4" class="layer">
        <video id="v4" src="assets/clips/ai-orb.mp4" muted playsinline data-start="12" data-duration="4.2" data-media-start="2" data-track-index="3"></video>
        <div class="shade"></div>
      </div>
      <div id="l5" class="layer">
        <video id="v5" src="assets/clips/documents.mp4" muted playsinline data-start="15.6" data-duration="6.2" data-media-start="1" data-playback-rate="1.5" data-track-index="4"></video>
        <div class="shade"></div>
      </div>
      <div id="l6" class="layer">
        <video id="v6" src="assets/clips/themes.mp4" muted playsinline data-start="21.2" data-duration="5" data-media-start="0.2" data-track-index="5"></video>
        <div class="shade"></div>
      </div>
      <div id="l7" class="layer clip" data-start="25.6" data-duration="0.7" data-track-index="6">
        <img src="assets/clips/welcome-start.png" alt="" />
      </div>

      <div id="c2" class="slot clip" data-start="3.4" data-duration="6" data-track-index="10">
        <div class="chip" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span><div class="chip-text"><span class="chip-title">Spotlight</span><span class="chip-sub">Files and commands, with a live preview</span></div></div>
      </div>
      <div id="c3" class="slot clip" data-start="8.8" data-duration="3.8" data-track-index="11">
        <div class="chip" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span><div class="chip-text"><span class="chip-title">Terminal</span><span class="chip-sub">Native PTY, WebGL rendering, shell integration</span></div></div>
      </div>
      <div id="c4" class="slot clip" data-start="12" data-duration="4.2" data-track-index="12">
        <div class="chip" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span><div class="chip-text"><span class="chip-title">AI agent</span><span class="chip-sub">Your keys or a local model, with an animated orb</span></div></div>
      </div>
      <div id="c5" class="slot clip" data-start="15.6" data-duration="6.2" data-track-index="13">
        <div class="chip" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span><div class="chip-text"><span class="chip-title">Documents</span><span class="chip-sub">Markdown and Word, with local PDF export</span></div></div>
      </div>
      <div id="c6" class="slot clip" data-start="21.2" data-duration="5" data-track-index="14">
        <div class="chip" data-layout-allow-overlap data-layout-allow-occlusion><span class="dot"></span><div class="chip-text"><span class="chip-title">Themes</span><span class="chip-sub">22 built-in themes, live as you click</span></div></div>
      </div>
    </div>

    <script>
      const XFADE = 0.6;
      const tl = gsap.timeline({ paused: true });

      // Each layer fades in over the one before it, so there is never a dip to black.
      const fades = [
        ["#l2", 3.4],
        ["#l3", 8.8],
        ["#l4", 12.0],
        ["#l5", 15.6],
        ["#l6", 21.2],
      ];
      for (const [sel, at] of fades) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: XFADE, ease: "power1.inOut" }, at);
      }
      tl.fromTo("#l7 img", { opacity: 0 }, { opacity: 1, duration: XFADE, ease: "power1.inOut" }, 25.6);

      // Captions arrive after the crossfade and leave before the next one begins.
      const chips = [
        ["#c2", 3.4, 6],
        ["#c3", 8.8, 3.8],
        ["#c4", 12.0, 4.2],
        ["#c5", 15.6, 6.2],
        ["#c6", 21.2, 5],
      ];
      for (const [sel, at, dur] of chips) {
        tl.fromTo(`${sel} .chip`, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.35);
        tl.to(`${sel} .chip`, { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, at + dur - XFADE - 0.35);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
